<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>B. Rao | SEO Tool</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #38bdf8; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #output { background: #334155; padding: 15px; margin-top: 20px; text-align: left; font-family: monospace; font-size: 12px; overflow-x: auto; display: none; }
    </style>
</head>
<body>
    <h1>SEO Meta Tag Generator 🚀</h1>
    <div class="box">
        <input type="text" id="title" placeholder="Site Title">
        <textarea id="desc" placeholder="Site Description"></textarea>
        <button onclick="generateTags()">Generate Tags</button>
        <div id="output"></div>
    </div>

    <script>
        function generateTags() {
            let t = document.getElementById('title').value;
            let d = document.getElementById('desc').value;
            let code = `&lt;title&gt;${t}&lt;/title&gt;<br>&lt;meta name="description" content="${d}"&gt;`;
            document.getElementById('output').innerHTML = code;
            document.getElementById('output').style.display = 'block';
        }
    </script>
</body>
</html>
