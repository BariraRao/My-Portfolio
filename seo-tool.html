<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>SEO Tool | Barira Rao</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 40px; }
        .box { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
        button { background: #38bdf8; color: #0f172a; padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Meta Tag Generator</h2>
        <input id="t" placeholder="Site Title">
        <textarea id="d" placeholder="Site Description"></textarea>
        <button onclick="gen()">Generate</button>
        <pre id="out" style="margin-top:20px; color:#38bdf8;"></pre>
    </div>
    <script>
        function gen() {
            const t = document.getElementById('t').value, d = document.getElementById('d').value;
            document.getElementById('out').innerText = `<title>${t}</title>\n<meta name="description" content="${d}">`;
        }
    </script>
</body>
</html>
