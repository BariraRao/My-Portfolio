<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEO Meta Generator | Barira Rao</title>
    <style>
        body { background: #061612; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .tool-card { background: #0c0c0c; padding: 40px; border-radius: 20px; border: 1px solid #1a2e29; width: 90%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h2 { color: #c5a059; letter-spacing: 2px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #c5a059; color: black; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #e2bd76; }
        #result { margin-top: 20px; padding: 15px; background: #000; border-left: 4px solid #c5a059; display: none; font-family: monospace; font-size: 0.85rem; color: #10b981; white-space: pre-wrap; word-break: break-all; }
        #copyBtn { background: #10b981; color: black; display: none; margin-top: 10px; padding: 10px; font-size: 0.85rem; }
        #copyBtn:hover { background: #34d399; }
        .back-link { display: block; margin-top: 20px; color: #555; text-decoration: none; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>
    <div class="tool-card">
        <h2>SEO Meta Tool</h2>
        <p style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">Generate technical meta tags for your website.</p>
        <input type="text" id="siteTitle" placeholder="Website Title">
        <textarea id="siteDesc" rows="3" placeholder="Website Description (SEO friendly)"></textarea>
        
        <button onclick="generateTags()">GENERATE TAGS</button>
        
        <div id="result"></div>
        <button id="copyBtn" onclick="copyToClipboard()">COPY TAGS</button>
        
        <a href="index.html" class="back-link">← Return to Portfolio</a>
    </div>

    <script>
        let generatedCode = "";

        function generateTags() {
            const title = document.getElementById('siteTitle').value;
            const desc = document.getElementById('siteDesc').value;
            const resultBox = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');
            
            if(!title || !desc) return alert("Please fill all fields");

            generatedCode = `<title>${title}</title>\n<meta name="description" content="${desc}">\n<meta name="author" content="Barira Rao">`;
            
            resultBox.innerText = generatedCode;
            resultBox.style.display = 'block';
            copyBtn.style.display = 'block';
            copyBtn.innerText = "COPY TAGS";
        }

        function copyToClipboard() {
            if (!generatedCode) return;
            
            navigator.clipboard.writeText(generatedCode).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Copied!";
            }).catch(err => {
                alert("Failed to copy code ", err);
            });
        }
    </script>
</body>
</html>
