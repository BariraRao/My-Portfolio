<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barique Gems | Auth</title>
    <style>
        body { background: #020706; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .auth-container { background: #050f0d; width: 850px; height: 500px; display: flex; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 50px rgba(197,160,89,0.05); border: 1px solid #132722; }
        .form-side { flex: 1; padding: 60px; color: #fff; display: flex; flex-direction: column; justify-content: center; }
        .visual-side { flex: 1; background: #020706; display: flex; justify-content: center; align-items: center; border-left: 1px solid #132722; }
        .visual-side img { width: 75%; filter: drop-shadow(0 0 40px rgba(197,160,89,0.25)); transition: 0.5s ease; }
        .visual-side:hover img { filter: drop-shadow(0 0 50px rgba(197,160,89,0.4)); }
        input { width: 100%; padding: 16px; margin: 12px 0; background: #091714; border: 1px solid #17332c; color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 0.9rem; letter-spacing: 1px; transition: 0.3s; }
        input:focus { outline: none; border-color: #c5a059; background: #0c211c; box-shadow: 0 0 15px rgba(197,160,89,0.1); }
        button { width: 100%; padding: 16px; background: #c5a059; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 24px; letter-spacing: 2px; font-size: 0.9rem; transition: 0.3s ease; box-shadow: 0 4px 15px rgba(197,160,89,0.2); }
        button:hover { background: #e2bd76; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(197,160,89,0.3); }
        .toggle { color: #666; font-size: 0.85rem; margin-top: 24px; cursor: pointer; text-align: center; letter-spacing: 1px; transition: 0.3s; }
        .toggle:hover { color: #c5a059; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="form-side">
            <h2 style="color: #c5a059; letter-spacing: 6px; margin: 0 0 5px 0; font-weight: 600;">BARIQUE</h2>
            <p id="sub" style="color: #445450; font-size: 0.8rem; letter-spacing: 3px; margin: 0 0 30px 0; font-weight: bold;">ROYAL ACCESS</p>
            <input type="text" id="u" placeholder="USERNAME" autocomplete="off">
            <input type="password" id="p" placeholder="PASSWORD">
            <button onclick="auth()" id="btn">CREATE ACCOUNT</button>
            <p class="toggle" onclick="toggle()" id="tog">Member? Login</p>
        </div>
        <div class="visual-side">
            <img src="logo.png" alt="Royal Logo">
        </div>
    </div>
    <script>
        let isL = false;
        function toggle() { 
            isL = !isL; 
            document.getElementById('sub').innerText = isL ? "MEMBER LOGIN" : "ROYAL ACCESS"; 
            document.getElementById('btn').innerText = isL ? "LOGIN" : "CREATE ACCOUNT"; 
            document.getElementById('tog').innerText = isL ? "New? Register" : "Member? Login"; 
            document.getElementById('u').value = "";
            document.getElementById('p').value = "";
        }

        function auth() {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value;
            
            if(!u || !p) return alert("Enter details");

            let users = JSON.parse(localStorage.getItem('users')) || [];

            if(isL) {
                const foundUser = users.find(user => user.u === u && user.p === p);
                if(foundUser) {
                    window.location.href = "boutique.html";
                } else {
                    alert("Access Denied: Invalid credentials");
                }
            } else {
                const userExists = users.some(user => user.u === u);
                if(userExists) return alert("Username already taken!");

                users.push({u, p});
                localStorage.setItem('users', JSON.stringify(users));
                alert("Account Created!"); 
                toggle();
            }
        }
    </script>
</body>
</html>
