<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login | Barira Rao</title>
    <style>
        body { background: #050505; color: #c5a059; font-family: serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #111; padding: 40px; border: 1px solid #c5a059; text-align: center; width: 320px; box-shadow: 0 0 30px rgba(197,160,89,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #c5a059; border: none; color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .toggle { font-size: 0.8rem; margin-top: 15px; cursor: pointer; color: #888; display: block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 style="letter-spacing: 5px;">BARIRA RAO</h2>
        <p id="sub">SIGN UP</p>
        <input type="text" id="u" placeholder="USERNAME">
        <input type="password" id="p" placeholder="PASSWORD">
        <button onclick="auth()" id="btn">CREATE ACCOUNT</button>
        <a class="toggle" onclick="toggle()" id="tog">Member? Login</a>
    </div>
    <script>
        let isL = false;
        function toggle() { isL = !isL; document.getElementById('sub').innerText = isL?"LOGIN":"SIGN UP"; document.getElementById('btn').innerText = isL?"LOGIN":"CREATE ACCOUNT"; }
        function auth() {
            const u = document.getElementById('u').value, p = document.getElementById('p').value;
            if(isL) {
                const s = JSON.parse(localStorage.getItem('user'));
                if(s && s.u === u && s.p === p) { window.location.href="boutique.html"; } else alert("Error!");
            } else { localStorage.setItem('user', JSON.stringify({u, p})); alert("Saved!"); toggle(); }
        }
    </script>
</body>
</html>
