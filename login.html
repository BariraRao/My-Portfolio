<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barique Gems | Auth</title>
    <style>
        body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .auth-container { background: #061612; width: 850px; height: 500px; display: flex; border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border: 1px solid #1a2e29; }
        .form-side { flex: 1; padding: 60px; color: #fff; }
        .visual-side { flex: 1; background: #040d0b; display: flex; justify-content: center; align-items: center; }
        .visual-side img { width: 80%; filter: drop-shadow(0 0 30px rgba(197,160,89,0.2)); }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #0a1f1a; border: 1px solid #1a3a32; color: #fff; border-radius: 10px; }
        button { width: 100%; padding: 15px; background: #c5a059; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .toggle { color: #888; font-size: 0.8rem; margin-top: 20px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="form-side">
            <h2 style="color: #c5a059; letter-spacing: 5px;">BARIQUE</h2>
            <p id="sub" style="color: #555;">ROYAL ACCESS</p>
            <input type="text" id="u" placeholder="USERNAME">
            <input type="password" id="p" placeholder="PASSWORD">
            <button onclick="auth()" id="btn">CREATE ACCOUNT</button>
            <p class="toggle" onclick="toggle()" id="tog">Member? Login</p>
        </div>
        <div class="visual-side">
            <img src="logo.png" alt="Royal Logo"> </div>
    </div>
    <script>
        let isL = false;
        function toggle() { isL = !isL; document.getElementById('sub').innerText = isL?"MEMBER LOGIN":"ROYAL ACCESS"; document.getElementById('btn').innerText = isL?"LOGIN":"CREATE ACCOUNT"; document.getElementById('tog').innerText = isL?"New? Register":"Member? Login"; }
        function auth() {
            const u = document.getElementById('u').value, p = document.getElementById('p').value;
            if(!u || !p) return alert("Enter details");
            if(isL) {
                const s = JSON.parse(localStorage.getItem('user'));
                if(s && s.u === u && s.p === p) window.location.href="boutique.html";
                else alert("Access Denied");
            } else {
                localStorage.setItem('user', JSON.stringify({u, p}));
                alert("Account Created!"); toggle();
            }
        }
    </script>
</body>
</html>
